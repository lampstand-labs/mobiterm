<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="manifest" href="./assets/manifest.json" />
    <title>mobiTerm</title>
    <meta
      name="description"
      content="A mobile-first web terminal for remote access from any device."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" size="any" />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="./assets/icon-180.png"
    />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-title" content="mobiTerm" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="importmap">
      {
        "imports": {
          "@mobiterm/shared-ui": "/shared/ui.js",
          "react": "/vendor/react.js",
          "react/jsx-dev-runtime": "/vendor/react-jsx-dev-runtime.js",
          "react/jsx-runtime": "/vendor/react-jsx-runtime.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js"
        }
      }
    </script>
    <script type="module">
      // Bootstrap: discover and load extension client bundles
      window.__mobiterm_extensions = {
        _extensions: [],
        register(ext) {
          this._extensions.push(ext);
        },
        getAll() {
          return this._extensions;
        },
      };

      try {
        const res = await fetch("/clientExtensions");
        const ids = await res.json();
        for (const id of ids) {
          await import("/extensions/" + id + "/client.js");
        }
      } catch {
        // No extensions or failed to load — proceed with core
      }
    </script>
    <script type="module" src="/frontend.js"></script>
  </body>
</html>
